---
- name: Add microsoft signing key
  become: true
  ansible.builtin.get_url:
    url: "https://packages.microsoft.com/keys/microsoft.asc"
    dest: /usr/share/keyrings/microsoft-keyring.asc
    mode: "0644"
    force: true

- name: Add vscode repo
  become: true
  ansible.builtin.deb822_repository:
    name: vscode
    types: deb
    uris:
      - "https://packages.microsoft.com/repos/vscode"
    suites: stable
    components:
      - main
    architectures:
      - amd64
    signed_by: /usr/share/keyrings/microsoft-keyring.asc
    state: present

- name: Install vscode
  become: true
  ansible.builtin.apt:
    state: present
    pkg: code
    update_cache: true
