---
- name: Add jlbarriere68 signing key
  become: true
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x5A51B8923E86E1DFE821F2E69A2637B6931207CE"
    dest: /usr/share/keyrings/jlbarriere68-keyring.asc
    mode: "0644"
    force: true

- name: Add jlbarriere68/noson-app repository
  become: true
  ansible.builtin.deb822_repository:
    name: jlbarriere68
    types: deb
    uris:
      - "https://ppa.launchpadcontent.net/jlbarriere68/noson-app/ubuntu"
    suites: "{{ ubuntu_codename }}"
    components:
      - main
    signed_by: /usr/share/keyrings/jlbarriere68-keyring.asc
    enabled: true
    state: present

- name: Install noson
  become: true
  ansible.builtin.apt:
    name: noson-app
    state: present

- name: Add firewall rules
  become: true
  ansible.builtin.template:
    src: templates/noson.j2
    dest: /etc/ufw/applications.d/noson
    mode: "0644"

- name: Update ufw
  become: true
  ansible.builtin.command: ufw app update noson
- name: Add rule firewal
  become: true
  community.general.ufw:
    rule: allow
    name: noson
    src: "192.168.0.0/24"
