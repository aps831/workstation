---
- name: Add cncf-buildpacks signing key
  become: true
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xAE98B36106B36420EE829C70E093C548579E5EB5"
    dest: /usr/share/keyrings/cncf-buildpacks-keyring.asc
    mode: "0644"
    force: true

- name: Add cncf-buildpacks pack cli repo
  become: true
  ansible.builtin.deb822_repository:
    name: cncf-buildpacks
    types: deb
    uris:
      - "https://ppa.launchpadcontent.net/cncf-buildpacks/pack-cli/ubuntu"
    suites: "{{ ubuntu_codename }}"
    components:
      - main
    signed_by: /usr/share/keyrings/cncf-buildpacks-keyring.asc
    enabled: true
    state: present

- name: Install packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - pack-cli
