---
#
# System Node
#

- name: Create temporary file for key
  become: true
  ansible.builtin.tempfile:
    state: file
    suffix: temp
  register: key_temp_file
  changed_when: false

- name: Download key
  become: true
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: "{{ key_temp_file.path }}"
    force: true

- name: Dearmor key
  become: true
  ansible.builtin.shell:
    cmd: cat {{ key_temp_file.path }} | gpg --dearmor >> /usr/share/keyrings/nodesource.gpg

- name: Add nodesource repository
  become: true
  ansible.builtin.deb822_repository:
    name: "nodesource"
    types: deb
    uris:
      - "https://deb.nodesource.com/node_{{ node_version }}.x"
    suites: nodistro
    components:
      - main
    architectures:
      - amd64
    signed_by: /usr/share/keyrings/nodesource.gpg
    enabled: true
    state: present

- name: Install nodejs
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
      - nodejs

- name: Upgrade npm
  become: true
  community.general.npm:
    name: npm
    global: true
    state: latest

- name: Install Cypress dependencies
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
      - libgtk-3-0t64
      - libgbm-dev
      - libnotify-dev
      - libnss3
      - libxss1
      - libasound2t64
      - libxtst6
      - xauth
      - xvfb
