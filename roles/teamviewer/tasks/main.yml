---
- name: Add teamviewer signing key
  become: true
  ansible.builtin.get_url:
    url: "https://linux.teamviewer.com/pubkey/currentkey.asc"
    dest: /usr/share/keyrings/teamviewer-keyring.asc
    mode: "0644"
    force: true

- name: Add teamviewer repo
  become: true
  ansible.builtin.deb822_repository:
    name: teamviewer
    types: deb
    uris:
      - "https://linux.teamviewer.com/deb"
    suites: stable
    components:
      - main
    signed_by: /usr/share/keyrings/teamviewer-keyring.asc
    state: present

- name: Apt-get install
  become: true
  ansible.builtin.apt:
    name: "teamviewer"
    state: "latest"
