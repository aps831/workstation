---
- name: Add sublimehq signing key
  become: true
  ansible.builtin.get_url:
    url: "https://download.sublimetext.com/sublimehq-pub.gpg"
    dest: /usr/share/keyrings/sublimehq-keyring.asc
    mode: "0644"
    force: true

- name: Add sublimehq repo
  become: true
  ansible.builtin.deb822_repository:
    name: sublimehq
    types: deb
    uris:
      - "https://download.sublimetext.com/"
    suites: apt/stable/
    signed_by: /usr/share/keyrings/sublimehq-keyring.asc
    state: present

- name: Install sublime
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
      - sublime-text
      - sublime-merge
