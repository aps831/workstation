---
- name: Install packages
  become: true
  ansible.builtin.apt:
    name: ca-certificates
    state: present

- name: Add pgadmin signing key
  become: true
  ansible.builtin.get_url:
    url: "https://www.pgadmin.org/static/packages_pgadmin_org.pub"
    dest: /usr/share/keyrings/pgadmin-keyring.asc
    mode: "0644"
    force: true

- name: Add pgadmin repo
  become: true
  ansible.builtin.deb822_repository:
    name: pgadmin
    types: deb
    uris:
      - "https://ftp.postgresql.org/pub/pgadmin/pgadmin4/apt/{{ ubuntu_codename }}"
    suites: pgadmin4
    components:
      - main
    signed_by: /usr/share/keyrings/pgadmin-keyring.asc
    state: present

- name: Install packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - pgadmin4
      - pgadmin4-desktop
