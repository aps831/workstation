---
- name: Install packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - wget
      - apt-transport-https
      - gnupg

- name: Add trivy signing key
  become: true
  ansible.builtin.get_url:
    url: "https://aquasecurity.github.io/trivy-repo/deb/public.key"
    dest: /usr/share/keyrings/trivy-keyring.asc
    mode: "0644"
    force: true

- name: Add trivy repo
  become: true
  ansible.builtin.deb822_repository:
    name: trivy
    types: deb
    uris:
      - "https://aquasecurity.github.io/trivy-repo/deb"
    suites: "{{ ubuntu_codename }}"
    components:
      - main
    signed_by: /usr/share/keyrings/trivy-keyring.asc
    state: present

- name: Install trivy
  become: true
  ansible.builtin.apt:
    name: trivy
    state: present
