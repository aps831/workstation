---
- name: Add google linux signing key
  become: true
  ansible.builtin.get_url:
    url: "https://dl-ssl.google.com/linux/linux_signing_key.pub"
    dest: /usr/share/keyrings/google-linux-keyring.asc
    mode: "0644"
    force: true

- name: Remove chrome repo
  become: true
  ansible.builtin.deb822_repository:
    name: google-chrome
    types: deb
    uris:
      - "https://dl.google.com/linux/chrome/deb/"
    suites: stable
    components:
      - main
    architectures:
      - amd64
    enabled: true
    state: absent

- name: Add chrome repo
  become: true
  ansible.builtin.deb822_repository:
    name: google-chrome
    types: deb
    uris:
      - "https://dl.google.com/linux/chrome/deb/"
    suites: stable
    components:
      - main
    architectures:
      - amd64
    signed_by: /usr/share/keyrings/google-linux-keyring.asc
    enabled: true
    state: present

- name: Install packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - chromium
      - firefox
      - google-chrome-stable
